    <!-- Classic (non-module) boot: third-party analytics must never gate React. -->
    <script data-cfasync="false">
      (function () {
        var THIRD_PARTY = /cloudflareinsights\.com|googletagmanager\.com|google-analytics\.com|googletagservices\.com|doubleclick\.net/i;
        window.addEventListener('error', function (event) {
          var el = event.target;
          if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK' && el.tagName !== 'IMG')) return;
          var url = el.src || el.href || '';
          if (!THIRD_PARTY.test(url)) return;
          event.preventDefault();
          event.stopPropagation();
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var msg = String((reason && reason.message) || reason || '');
          var stack = String((reason && reason.stack) || '');
          if (!THIRD_PARTY.test(msg) && !THIRD_PARTY.test(stack)) return;
          event.preventDefault();
        });
        window.addEventListener('error', function (event) {
          var el = event.target;
          if (!el || el.tagName !== 'SCRIPT') return;
          var url = el.src || '';
          if (url.indexOf('/assets/') === -1) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          // After a deploy, HTML and hashed assets can briefly mismatch — retry once.
          try {
            var key = 'americonfort:chunk-reload';
            if (!sessionStorage.getItem(key)) {
              sessionStorage.setItem(key, '1');
              var next = new URL(window.location.href);
              next.searchParams.set('_', String(Date.now()));
              window.location.replace(next.toString());
              return;
            }
          } catch (e) { /* private mode */ }
          root.innerHTML = '<div style="min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;text-align:center;color:#0f172a"><p style="font-size:1.125rem;font-weight:600">Unable to load Americonfort</p><p style="margin-top:8px;max-width:28rem;color:#64748b">The application files did not load. Refresh the page. If it happens again, clear this site cache and retry.</p><p style="margin-top:16px"><a href="/" style="color:#8f1f1f;font-weight:600">Refresh</a></p></div>';
        }, true);
      })();
    </script>
