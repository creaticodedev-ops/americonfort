    <div id="root"></div>
    <!-- Classic (non-module) boot: third-party analytics must never gate React. -->
    <script data-cfasync="false">
      (function () {
        var THIRD_PARTY = /cloudflareinsights\.com|googletagmanager\.com|google-analytics\.com|googletagservices\.com|doubleclick\.net/i;
        var RELOAD_KEY = 'americonfort:chunk-reload';
        var RELOAD_COUNT_KEY = 'americonfort:chunk-reload-count';

        function clearClientCaches() {
          try {
            sessionStorage.removeItem(RELOAD_KEY);
            sessionStorage.removeItem(RELOAD_COUNT_KEY);
          } catch (e) { /* private mode */ }
          try {
            if (navigator.serviceWorker) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
          } catch (e) { /* ignore */ }
          try {
            if (window.caches) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              });
            }
          } catch (e) { /* ignore */ }
        }

        function hardRecover() {
          clearClientCaches();
          var next = new URL(window.location.origin + '/');
          next.searchParams.set('_recover', String(Date.now()));
          window.location.replace(next.toString());
        }

        window.__acHardRecover = hardRecover;

        window.addEventListener('error', function (event) {
          var el = event.target;
          if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK' && el.tagName !== 'IMG')) return;
          var url = el.src || el.href || '';
          if (!THIRD_PARTY.test(url)) return;
          event.preventDefault();
          event.stopPropagation();
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var msg = String((reason && reason.message) || reason || '');
          var stack = String((reason && reason.stack) || '');
          if (!THIRD_PARTY.test(msg) && !THIRD_PARTY.test(stack)) return;
          event.preventDefault();
        });
        window.addEventListener('error', function (event) {
          var el = event.target;
          if (!el || el.tagName !== 'SCRIPT') return;
          var url = el.src || '';
          if (url.indexOf('/assets/') === -1) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;

          // Stale HTML after deploy → missing hashed bundle. Recover up to 2 times.
          var count = 0;
          try {
            count = parseInt(sessionStorage.getItem(RELOAD_COUNT_KEY) || '0', 10) || 0;
          } catch (e) { /* private mode */ }

          if (count < 2) {
            try {
              sessionStorage.setItem(RELOAD_KEY, '1');
              sessionStorage.setItem(RELOAD_COUNT_KEY, String(count + 1));
            } catch (e) { /* private mode */ }
            var next = new URL(window.location.origin + '/');
            next.searchParams.set('_', String(Date.now()));
            window.location.replace(next.toString());
            return;
          }

          try {
            sessionStorage.removeItem(RELOAD_KEY);
            sessionStorage.removeItem(RELOAD_COUNT_KEY);
          } catch (e) { /* private mode */ }

          root.innerHTML = '<div style="min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;text-align:center;color:#0f172a"><p style="font-size:1.125rem;font-weight:600">Unable to load Americonfort</p><p style="margin-top:8px;max-width:28rem;color:#64748b">The application files did not load — usually a stale cache after an update. Clear this site&apos;s data or tap Recover.</p><p style="margin-top:16px"><a href="/" id="ac-recover" style="color:#8f1f1f;font-weight:600">Recover</a></p></div>';
          var recover = document.getElementById('ac-recover');
          if (recover) {
            recover.addEventListener('click', function (ev) {
              ev.preventDefault();
              hardRecover();
            });
          }
        }, true);
      })();
    </script>
