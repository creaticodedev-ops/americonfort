    <!-- Classic (non-module) boot: third-party analytics must never gate React. -->
    <script data-cfasync="false">
      (function () {
        var THIRD_PARTY = /cloudflareinsights\.com|googletagmanager\.com|google-analytics\.com|googletagservices\.com|doubleclick\.net/i;
        var RELOAD_KEY = 'americonfort:chunk-reload';
        var RELOAD_COUNT_KEY = 'americonfort:chunk-reload-count';
        var recovering = false;

        function clearServiceWorkerAndCaches() {
          var jobs = [];
          try {
            if (navigator.serviceWorker) {
              jobs.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              );
            }
          } catch (e) { /* ignore */ }
          try {
            if (window.caches) {
              jobs.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              );
            }
          } catch (e) { /* ignore */ }
          return Promise.all(jobs).catch(function () { /* ignore */ });
        }

        /**
         * Manual recover only. Do NOT clear reload guards here — wiping them
         * on every ?_=/_recover navigation caused an infinite reload loop with
         * main.jsx's vite:preloadError handler.
         */
        function hardRecover() {
          if (recovering) return;
          recovering = true;
          clearServiceWorkerAndCaches().finally(function () {
            try {
              sessionStorage.setItem(RELOAD_KEY, 'done');
              sessionStorage.setItem(RELOAD_COUNT_KEY, '1');
            } catch (e) { /* private mode */ }
            var next = new URL(window.location.origin + '/');
            next.searchParams.set('_recover', String(Date.now()));
            window.location.replace(next.toString());
          });
        }

        window.__acHardRecover = hardRecover;

        // Cosmetic: strip bust params from the address bar. Keep session guards intact.
        try {
          var u = new URL(window.location.href);
          if (u.searchParams.has('_recover') || u.searchParams.has('_') || u.searchParams.has('chunk_reload')) {
            u.searchParams.delete('_recover');
            u.searchParams.delete('_');
            u.searchParams.delete('chunk_reload');
            window.history.replaceState({}, '', u.pathname + u.search + u.hash);
          }
        } catch (e) { /* ignore */ }

        window.addEventListener('error', function (event) {
          var el = event.target;
          if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK' && el.tagName !== 'IMG')) return;
          var url = el.src || el.href || '';
          if (!THIRD_PARTY.test(url)) return;
          event.preventDefault();
          event.stopPropagation();
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var msg = String((reason && reason.message) || reason || '');
          var stack = String((reason && reason.stack) || '');
          if (!THIRD_PARTY.test(msg) && !THIRD_PARTY.test(stack)) return;
          event.preventDefault();
        });

        function showRecoverUi(root) {
          root.innerHTML =
            '<div style="min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;text-align:center;color:#0f172a">' +
            '<p style="font-size:1.125rem;font-weight:600">Unable to load Americonfort</p>' +
            '<p style="margin-top:8px;max-width:28rem;color:#64748b">The application files did not load — usually a stale cache after an update. Clear this site&apos;s data or tap Recover.</p>' +
            '<p style="margin-top:16px"><a href="/?_recover=1" id="ac-recover" style="color:#8f1f1f;font-weight:600">Recover</a></p></div>';
          var recover = document.getElementById('ac-recover');
          if (recover) {
            recover.addEventListener('click', function (ev) {
              ev.preventDefault();
              hardRecover();
            });
          }
        }

        // Only for the main entry script tag (not lazy chunks — those are handled in main.jsx).
        window.addEventListener('error', function (event) {
          var el = event.target;
          if (!el || el.tagName !== 'SCRIPT') return;
          var url = el.src || '';
          if (url.indexOf('/assets/index-') === -1) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0 || recovering) return;

          var count = 0;
          try {
            count = parseInt(sessionStorage.getItem(RELOAD_COUNT_KEY) || '0', 10) || 0;
            if (sessionStorage.getItem(RELOAD_KEY) === 'done' || count >= 1) {
              showRecoverUi(root);
              return;
            }
            sessionStorage.setItem(RELOAD_COUNT_KEY, String(count + 1));
            sessionStorage.setItem(RELOAD_KEY, 'pending');
          } catch (e) { /* private mode */ }

          recovering = true;
          clearServiceWorkerAndCaches().finally(function () {
            var next = new URL(window.location.origin + '/');
            next.searchParams.set('_', String(Date.now()));
            window.location.replace(next.toString());
          });
        }, true);
      })();
    </script>
